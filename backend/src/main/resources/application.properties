# Server port
server.port=8080

# PostgreSQL DB config
# spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?user=postgres.aueephahrushtpyjtulq&password=01blogpass1991&sslmode=require&prepareThreshold=0
spring.datasource.url=jdbc:postgresql://localhost:5432/appdb
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update

# HikariCP settings - force connection refresh after your table drop
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate / JPA

# spring.jpa.hibernate.ddl-auto=create    # or validate / none / use migrations (recommended)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT settings
# jwt.secret=${JWT_SECRET}
# jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.secret=U3VwZXJTZWNyZXRLZXlTdXBlclNlY3JldEtleVN0cmluZzEyMzQ1Ng==
jwt.expiration=1200000000
jwt.refreshExpirationMs=86400

# Clean console output
logging.level.root=WARN
logging.level.com.example.blog=DEBUG
logging.pattern.console=%d{HH:mm:ss} %highlight(%-5level) %cyan(%logger{15}) - %msg%n

# Show SQL (if needed)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB