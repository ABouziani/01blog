<div class="container py-5 form-page-container">
  <div class="card shadow-lg p-4 p-md-5 mx-auto update-form-card">

    <h2 class="text-center fw-bold mb-4 text-primary">✏️ Update Profile</h2>

    <form [formGroup]="userForm" (ngSubmit)="updateProfile()" novalidate>

      <div class="mb-4">
        <label for="username" class="form-label fw-semibold">Username</label>
        <input type="text" id="username" 
          class="form-control-plaintext fw-bold text-dark border-bottom pb-1" 
          disabled 
          [value]="editing?.username">
        <small class="form-text text-muted">Username cannot be changed.</small>
      </div>

      <div class="mb-4">
        <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
        <input type="text" id="email" formControlName="email"
          class="form-control"
          [class.is-invalid]="email?.invalid && email?.touched"
          placeholder="Enter a new email address">

        <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['minlength']">Email must be at least 3 characters.</span>
          <span *ngIf="email?.errors?.['maxlength']">Email cannot exceed 100 characters.</span>
        </div>
      </div>

      <div class="mb-4">
        <label for="bio" class="form-label fw-semibold">Bio <span class="text-danger">*</span></label>
        <textarea id="bio" formControlName="bio"
          class="form-control"
          [class.is-invalid]="bio?.invalid && bio?.touched"
          placeholder="Enter a brief biography (max 500 characters)"
          rows="6"></textarea>

        <div class="invalid-feedback" *ngIf="bio?.invalid && bio?.touched">
          <span *ngIf="bio?.errors?.['required']">Bio is required.</span>
          <span *ngIf="bio?.errors?.['maxlength']">Bio cannot exceed 500 characters.</span>
        </div>
      </div>

      <div class="mb-4 p-3 border rounded-3 media-upload-box">
        <h5 class="fw-bold mb-3 text-secondary">Profile Photo</h5>
        
        <label class="form-label fw-semibold">Current Photo Preview</label>
        
        <div class="d-flex align-items-center mb-3">
          <div class="profile-avatar-current rounded-circle shadow-sm flex-shrink-0 me-3" 
               [style.background-image]="'url(http://localhost:8080' + editing?.photo + ')'">
          </div>
          
          <button class="btn btn-sm btn-outline-danger remove-btn-sm" 
                  *ngIf="editing?.photo" 
                  type="button" 
                  (click)="removePhoto()">
            <i class="bi bi-trash me-1"></i> Remove Current Photo
          </button>
        </div>

        <hr class="my-3">

        <label for="media" class="form-label fw-semibold">Upload New Photo (optional)</label>
        <input type="file" id="media" (change)="onFileSelected($event)" accept="image/*" class="form-control">
        <small class="form-text text-muted hint">Supported: JPG, PNG, GIF (max 10MB)</small>

        <div *ngIf="previewUrl" class="mt-3 text-center new-media-preview-box">
          <label class="form-label fw-semibold text-muted small">New Photo Preview:</label>
          <img [src]="previewUrl" alt="Preview" class="media-preview rounded-circle img-fluid shadow">
          
          <button type="button" (click)="selectedFile = null; previewUrl = null;" class="btn btn-sm btn-outline-secondary mt-2">
            <i class="bi bi-x-circle me-1"></i> Remove Preview
          </button>
        </div>

        <div class="alert alert-warning mt-3 small" *ngIf="errorMessage && !userForm.invalid">
          {{ errorMessage }}
        </div>
      </div>

      <div class="form-actions d-flex justify-content-end gap-3 pt-3 border-top">
        
        <button type="button" 
                *ngIf="editing" 
                (click)="cancelEdit()" 
                class="btn btn-outline-secondary cancel-btn">
          Cancel
        </button>

        <button type="submit" 
                [disabled]="isSubmitting || userForm.invalid" 
                class="btn btn-success submit-btn">
          <span *ngIf="!isSubmitting">Update Profile</span>
          <span *ngIf="isSubmitting">Submitting... <i class="spinner-border spinner-border-sm ms-2"></i></span>
        </button>
      </div>
    </form>
  </div>
</div>
