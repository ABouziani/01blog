<div class="posts-container">
  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
  </div>


  <!-- Posts Section -->
  <h2 class="posts-section-title">Posts</h2>
  <div class="posts-grid" *ngIf="displayedPosts">
    <div class="post-card" *ngFor="let post of displayedPosts" [routerLink]="['/posts', post.id]">
      <div class="post-image" [style.background-image]="'url(' + 'http://localhost:8080' + post.media + ')'">
      </div>
      <div class="post-meta">
        <span class="post-author" [routerLink]="['/users', post.creatorId]">
          {{ post.creatorUsername }}
        </span>
        <time class="post-date" [attr.datetime]="post.createdAt">
          {{ post.createdAt | date:'mediumDate' }}
        </time>
      </div>
      <div class="post-body">
        <h3 class="post-title">{{ post.title }}</h3>
        <p class="post-description">
          {{ post.description.length > 80 ? post.description.substring(0,77) + '...' : post.description }}
        </p>
      </div>
      <div class="reactions">
        <span class="post-likes">
          {{ post.likes }}
        </span>
        <span class="post-dislikes">
          {{ post.dislikes }}
        </span>
      </div>

      <div #scrollSentinel class="scroll-sentinel"></div>

    </div>

    <div class="empty-posts" *ngIf="!displayedPosts">
      <div class="empty-posts-icon">📝</div>
      <br>
      <p class="empty-posts-text">No posts yet</p>
    </div>
  </div>
  <div class="loading-more" *ngIf="loadingMore">
    Loading posts...
  </div>
  <div class="all-loaded" *ngIf="allLoaded">
    <div class="empty-posts-icon">📝</div>
    <br>
    <p class="empty-posts-text">No more posts!</p>
  </div>
</div>
