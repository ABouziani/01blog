<div class="container py-4">
  <div class="row gx-5" *ngIf="post">
    <!-- Left Sidebar (Author) -->
    <aside class="leftsidebar d-none d-lg-block">
      <!-- Profile Card -->
      <div class="card-bg rounded-3 p-4 mb-4">
        <div class="avatar"
          [style.background-image]="post.creator.photo ? 'url(' + post.creator.photo + ')' : 'url(/user_avatar)'"></div>
        <div class="d-flex gap-3 mb-3">
          <div>
            <h2 class="content h5 fw-bold mb-1">{{ post.creator.username }}</h2>
            <p class="text-muted small mb-0">{{ post.creator.bio }}</p>
          </div>
        </div>
        <button class="btn btn-gradient w-100 py-2"
          (click)="router.navigate(['/users/' + post.creator.id])">Discover</button>
      </div>

      <!-- More from Author -->
      <div class="card-bg rounded-3 p-0">
        <!-- <h3 class="h6 fw-bold text-dark dark:text-white px-3 py-2 mb-0">More from {{ post.creator.username }}</h3> -->
        <div class="list-group list-group-flush border-0">
          <!-- <a *ngFor="let title of author.posts"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center card-hover rounded-0 px-3 py-2  text-truncate"
            href="#">
            {{ title }}
            <span class="material-symbols-outlined text-muted dark:text-white">arrow_forward</span>
          </a> -->
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="middle">
      <article class="card-bg rounded-3 p-4 p-sm-5 p-lg-6">
        <header class="mb-4">
          <h1 class="title h2 fw-bold  mb-3">
            {{ post.title }}
          </h1>
          <div class="text-muted small">
            By @{{ post.creator.username }} · Published on {{ post.createdAt | date:'short' }}
          </div>
        </header>

        <div class="content prose">
          <p *ngIf="!isEditing" [innerText]="post.description"></p>
        </div>

        <!-- Tags -->
        <!-- <footer class="mt-5 pt-3 border-top border-gray-200 dark:border-gray-700">
          <div class="d-flex flex-wrap gap-2">
            <span *ngFor="let tag of tags" class="tag-pill px-2 py-1 small fw-medium">
              {{ tag }}
            </span>
          </div>
        </footer> -->
      </article>
    </main>

    <!-- Right Sidebar (Social) -->
    <aside class="rightsidebar d-xl-block">
      <div class="sticky-sidebar">
        <div class="card-bg rounded-3 p-4 h-100 d-flex flex-column">
          <!-- Kudos -->
          <div class="text-center mb-4">
            <!-- Engagement -->
            <div class="d-flex gap-3 mb-4 post-engagement justify-content-center">
              <!-- Like Button -->
              <button class="engagement-btn like-btn" [disabled]="postService.waiting">
                <span class="material-symbols-outlined">thumb_up</span>
                <span class="fw-semibold small">{{ post?.likes || 0 }}</span>
              </button>

              <!-- Dislike Button -->
              <button class="engagement-btn dislike-btn" [disabled]="postService.waiting">
                <span class="material-symbols-outlined">thumb_down</span>
                <span class="fw-semibold small">{{ post?.dislikes || 0 }}</span>
              </button>
            </div>
          </div>

          <hr class="border-gray-200 dark:border-gray-700 my-3">

          <!-- Comments -->

          <h3 class="title h6 fw-bold  mb-3">Comments ({{ post.comments.length }})</h3>
          <div class="comments d-flex flex-column gap-3">
            <div *ngFor="let c of post.comments" class="d-flex gap-2">
              <img [src]="c.user.photo ? c.user.photo : '/user_avatar.png'"
                class="avatar-sm rounded-circle flex-shrink-0" alt="{{ c.user.username }} avatar">
              <div class="flex-grow-1">
                <div class="bg-light dark:bg-gray-700 rounded-2 rounded-start-0 p-3">
                  <p class="fw-semibold mb-1 small">{{ c.user.username }}</p>
                  <p class="text-muted small mb-0">{{ c.content }}</p>
                </div>
                <p class="text-muted small mt-1 ps-1">{{ c.createdAt | date:'short' }}</p>
              </div>
            </div>
          </div>


          <!-- Comment Form -->
          <app-add-comment [postId]="post.id" (commentPosted)="onCommentAdded($event)"></app-add-comment>
        </div>
      </div>
    </aside>
  </div>
</div>
