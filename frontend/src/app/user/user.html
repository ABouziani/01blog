 <main class="container py-4 py-lg-5" *ngIf="user">
    <div class="row justify-content-center">
      <div class="col-12">
        <!-- Profile Card -->
        <div class="profile-card">
          <div class="profile-header"></div>
          <div class="profile-content">
            <div class="profile-avatar" [style.background-image]="'url(' + user.photo + ')'"></div>
            
            <div class="profile-info">
              <h1 class="profile-username">{{ user.username }}</h1>
              <p class="profile-bio">{{ user.bio }}</p>

              <div class="info-grid">
                <div class="info-item">
                  <div class="info-icon">
                    <i class="bi bi-person-badge"></i>
                  </div>
                  <div class="info-text">ID: {{ user.id }}</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">
                    <i class="bi bi-envelope"></i>
                  </div>
                  <div class="info-text">{{ user.email }}</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">
                    <i class="bi bi-calendar-check"></i>
                  </div>
                  <div class="info-text">Joined: {{ user.createdAt | date:"short" }}</div>
                </div>
                <div class="info-item">
                  <div class="info-icon">
                    <i class="bi bi-award"></i>
                  </div>
                  <div class="info-text">Role: {{ user.role }}</div>
                </div>
              </div>

              <div class="action-buttons">
                <button class="btn-action btn-subscribe" (click)="follow()" *ngIf="!user.alreadyFollowed">
                  <svg class="btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 002 2zm6-6V11c0-3.07-1.63-5.64-4.5-6.32V4a1.5 
                      1.5 0 00-3 0v.68C7.63 5.36 6 7.92 6 11v5l-1.99 
                      2H20l-2-2z" />
                  </svg>
                  Subscribe
                </button>
                <button class="btn-action btn-unsubscribe" (click)="unfollow()" *ngIf="user.alreadyFollowed">
                  <svg class="btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 002 2zm6-6V11c0-3.07-1.63-5.64-4.5-6.32V4a1.5 
                      1.5 0 00-3 0v.68C7.63 5.36 6 7.92 6 11v5l-1.99 
                      2H20l-2-2z" />
                  </svg>
                  Unsubscribe
                </button>
                <button class="btn-action btn-report" (click)="reportUser()" *ngIf="!user.alreadyReported">
                  <svg class="btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 
                      10-4.48 10-10S17.52 2 12 2zm0 15h-1v-6h2v6h-1zm0-8h-1V7h2v2h-1z" />
                  </svg>
                  Report
                </button>

                <button class="btn-action btn-report" disabled *ngIf="user.alreadyReported">
                  <svg class="btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 
                      10-4.48 10-10S17.52 2 12 2zm0 15h-1v-6h2v6h-1zm0-8h-1V7h2v2h-1z" />
                  </svg>
                  Already Reported
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Posts Section -->
        <h2 class="posts-section-title">Posts</h2>
        <div class="posts-grid" *ngIf="user.posts">
          <div class="post-card" 
               *ngFor="let post of user?.posts"
               (click)="router.navigate(['/posts/' + post.id])">
            <div class="post-image" 
                 [style.background-image]="'url(' + 'http://localhost:8080' + post.media + ')'">
            </div>
            <div class="post-body">
              <h3 class="post-title">{{ post.title }}</h3>
              <p class="post-description">
                {{ post.description.length > 80 ? post.description.substring(0,77) + '...' : post.description }}
              </p>
            </div>
          </div>

          <div class="empty-posts" *ngIf="!user.posts || user.posts.length === 0">
            <div class="empty-posts-icon">📝</div>
            <p class="empty-posts-text">No posts yet</p>
          </div>
        </div>
      </div>
    </div>
  </main>
