

<main class="container py-4" *ngIf="user">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10">
      <!-- Profile Card -->
      <div class="card-bg rounded-3 p-4 mb-5">
        <div class="row g-4">
          <div class="col-12 col-md-4 d-flex justify-content-center">
            <div class="avatar" [style.background-image]="'url(' + user.photo + ')'"></div>
          </div>
          <div class="col-12 col-md-8">
            <h1 class="h2 fw-bold">{{ user.username }}</h1>
            <p class="text-muted mb-4">{{ user.bio }}</p>

            <div class="row g-2 mb-4">
              <div class="col-12 col-sm-6 d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">badge</span>
                <small class="text-muted">ID: {{ user.id }}</small>
              </div>
              <div class="col-12 col-sm-6 d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">email</span>
                <small class="text-muted">{{ user.email }}</small>
              </div>
              <div class="col-12 col-sm-6 d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">calendar_today</span>
                <small class="text-muted">Joined: {{ user.createdAt | date :"short" }}</small>
              </div>
              <div class="col-12 col-sm-6 d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">school</span>
                <small class="text-muted">Role: {{ user.role }}</small>
              </div>
            </div>

            <div class="d-flex gap-2 flex-column flex-md-row">
              <button class="btn btn-primary-custom flex-grow-1">Subscribe</button>
              <button class="btn btn-outline-custom flex-grow-1">Report</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Posts Section -->
      <h2 class="h3 fw-bold mb-4">Posts</h2>
      <div class="row g-4" >
        <div class="col-12 col-sm-6 col-lg-4"  *ngFor="let post of user?.posts">
          <div class="card-bg rounded-3 overflow-hidden h-100">
            <div class="post-img" [style.background-image]="'url(' + 'http://localhost:8080' + post.media + ')'"></div>
            <div class="p-4 d-flex flex-column flex-grow-1">
              <h3 class="h5 fw-bold mb-2 text-dark dark:text-white">{{ post.title }}</h3>
              <p class="text-muted flex-grow-1">{{ post.description }}</p>
              <!-- <div class="d-flex gap-3 mt-2 text-muted">
                <div class="d-flex align-items-center gap-1">
                  <span class="material-symbols-outlined text-success">thumb_up</span>
                  <small>{{ post.likes }}</small>
                </div>
                <div class="d-flex align-items-center gap-1">
                  <span class="material-symbols-outlined text-danger">thumb_down</span>
                  <small>{{ post.dislikes }}</small>
                </div>
              </div> -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
