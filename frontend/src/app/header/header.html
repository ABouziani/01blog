<header class="app-header bg-light">
  <div class="logocontainer">
    <a class="navbar-brand" routerLink="/">
      <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
      </svg>
      <strong class="logo">01Blog</strong>
    </a>
  </div>
  <nav class="menu">
    <a class="link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="bi bi-house link-icon"></i>
      <span class="link-title"></span>
    </a>

    <!-- Notifications (only when logged in) -->
    <ng-container *ngIf="authService.isLoggedIn()">
      <div class="dropdown notif-dropdown-container">
        <button class="btn btn-link position-relative p-0" type="button" (click)="toggleDropdown()"  id="notifDropdown" data-bs-toggle="dropdown"
          aria-expanded="false" aria-label="Notifications">
          <a class="link">
            <i class="bi bi-bell link-icon"></i>
            <span class="link-title"></span>
          </a>
          <span *ngIf="unreadCount > 0"
            class=" notifcount position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{ unreadCount }}
          </span>
        </button>

        <ul class="dropdown-menu dropdown-menu-notifs dropdown-menu-end shadow" aria-labelledby="notifDropdown"
          (wheel)="trapScroll($event)" style="width: 320px; max-height: 400px; overflow-y: auto;">
          <!-- Header -->
          <li class="px-3 py-2 d-flex justify-content-between align-items-center border-bottom">
            <strong class="notif-title">Notifications</strong>
            <button class="btn btn-sm btn-outline-primary py-0 px-2" (click)="markAllRead()">Mark all read</button>
          </li>

          <!-- Notifications list -->
          <ng-container *ngIf="notifications?.length; else noNotif">
            <li *ngFor="let n of notifications">
              <a class="notif-dropdown-item py-2 px-3 d-flex align-items-start" [class.notif-unread]="n.unread"
                (click)="openNotification(n)">
                <img [src]="n.authorPhoto ? 'http://localhost:8080' + n.authorPhoto : '/user_avatar.png'"
                  class="rounded-circle me-2" width="36" height="36" alt="{{ n.authorUsername }} avatar" />
                <div class="flex-grow-1">
                  <div class="clickable fw-medium">
                    <span class="notif-text">{{ n.authorUsername }}</span> created a new post
                  </div>
                  <div class="d-flex justify-content-between align-items-center mt-1">
                    <small class="text-muted">{{ n.postCreatedAt | date: 'short' }}</small>
                    <button class="markBtn btn btn-link p-0 text-decoration-none"
                      (click)="(n.unread ? markRead(n.id) : markUnRead(n.id)); $event.stopPropagation();"
                      [class.text-primary]="n.unread" [class.text-muted]="!n.unread">
                      <small>{{ n.unread ? 'Mark as read' : 'Mark as unread' }}</small>
                    </button>
                  </div>
                </div>
                <span *ngIf="n.unread" class="ms-2 text-primary align-self-center">
                  <i class="bi bi-circle-fill" style="font-size: 6px;"></i>
                </span>
              </a>
            </li>
          </ng-container>

          <ng-template #noNotif>
            <li>
              <div class="dropdown-item text-center text-muted py-3">No notifications</div>
            </li>
          </ng-template>
          <div class="loading-more" *ngIf="loadingMore">
            Loading notifications...
          </div>
          <div class="all-loaded" *ngIf="allLoaded">
            <div class="empty-comments-icon">📝</div>
            <br>
            <p class="empty-comments-text">No more notifications!</p>
          </div>
        </ul>
      </div>
    </ng-container>

    <!-- Dropdown Container -->
    <div class="dropdown">
      <button class="btn dropdown-toggle account-btn" type="button" id="menuDropdown" data-bs-toggle="dropdown"
        aria-expanded="false">
        <i class="bi bi-person-circle" style="font-size: 1.375rem;"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-end custom-dropdown" aria-labelledby="menuDropdown">
        <!-- Admin Panel -->
        <li *ngIf="authService.isAdmin() && authService.isLoggedIn()">
          <a class="dropdown-item clickable" routerLink="/adminpanel" routerLinkActive="active">
            <i class="bi bi-speedometer2"></i>
            Admin Panel
          </a>
        </li>

        <!-- Not logged in -->
        <ng-container *ngIf="!authService.isLoggedIn()">
          <li>
            <a class="dropdown-item clickable" routerLink="/signin" routerLinkActive="active">
              <i class="bi bi-box-arrow-in-right"></i>
              Sign in
            </a>
          </li>
          <li>
            <a class="dropdown-item clickable" routerLink="/register" routerLinkActive="active">
              <i class="bi bi-person-plus"></i>
              Register
            </a>
          </li>
        </ng-container>

        <!-- Logged in -->
        <ng-container *ngIf="authService.isLoggedIn()">
          <li>
            <a class="dropdown-item clickable" routerLink="/myprofile" routerLinkActive="active">
              <i class="bi bi-person-circle"></i>
              Profile
            </a>
          </li>
          <li>
            <a class="dropdown-item clickable" routerLink="/posts/create" routerLinkActive="active">
              <i class="bi bi-plus-circle"></i>
              Create new post
            </a>
          </li>
          <li>
            <button class="dropdown-item clickable" (click)="authService.logout()">
              <i class="bi bi-box-arrow-right"></i>
              Logout
            </button>
          </li>
        </ng-container>
      </ul>
    </div>

    <!-- Theme Switch -->
    <div class="theme-switch">
      <input type="checkbox" id="themeCheckbox" class="checkbox" [checked]="darkMode" (change)="toggleDarkMode()">
      <label for="themeCheckbox" class="checkbox-label">
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-sun"></i>
        <span class="ball"></span>
      </label>
    </div>
  </nav>
</header>
