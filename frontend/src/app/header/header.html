<header class="app-header">
  <div class="logo">My 01Blog</div>
  <nav class="menu">
    <a class="link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span class="link-icon material-symbols-rounded">home</span>
      <span class="link-title">Home</span>
    </a>

    <a class="link" routerLink="/about" routerLinkActive="active">
      <span class="link-icon material-symbols-rounded">info</span>
      <span class="link-title">About</span>
    </a>

    <a class="link" routerLink="/contact" routerLinkActive="active">
      <span class="link-icon material-symbols-rounded">mail</span>
      <span class="link-title">Contact</span>
    </a>

    <!-- Non connecté -->
    <ng-container *ngIf="!authService.isLoggedIn()">
      <a class="link" routerLink="/signin" routerLinkActive="active">
        <span class="link-icon material-symbols-rounded">login</span>
        <span class="link-title">Signin</span>
      </a>
      <a class="link" routerLink="/register" routerLinkActive="active">
        <span class="link-icon material-symbols-rounded">person_add</span>
        <span class="link-title">Register</span>
      </a>
    </ng-container>

    <!-- Connecté -->
    <ng-container *ngIf="authService.isLoggedIn()">
      <a class="link" routerLink="/profile" routerLinkActive="active">
        <span class="link-icon material-symbols-rounded">account_circle</span>
        <span class="link-title">Profile</span>
      </a>

      <a class="link" routerLink="/posts/create" routerLinkActive="active">
        <span class="link-icon material-symbols-rounded">edit_note</span>
        <span class="link-title">Create</span>
      </a>

      <button class="link logout-btn" (click)="authService.logout()">
        <span class="link-icon material-symbols-rounded">logout</span>
        <span class="link-title">Logout</span>
      </button>
    </ng-container>
  <!-- Notifications (only when logged in) -->
    <ng-container *ngIf="authService.isLoggedIn()">
      <div class="notif-wrapper" (clickOutside)="closeDropdown()" #notifRoot>
        <button class="link notif-btn" (click)="toggleDropdown($event)" aria-haspopup="true" aria-expanded="{{dropdownOpen}}">
          <span class="link-icon material-symbols-rounded">notifications</span>
          <span class="link-title">Notifications</span>
          <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <!-- Dropdown -->
        <div class="notif-dropdown" *ngIf="dropdownOpen" role="menu" aria-label="Notifications">
          <div class="notif-header">
            <span>Notifications</span>
            <button class="mark-all" (click)="markAllRead($event)" [disabled]="unreadCount === 0">Mark all read</button>
          </div>

          <div class="notif-list" *ngIf="notifications && notifications.length > 0; else noNotif">
            <div *ngFor="let n of notifications" class="notif-item" [class.unread]="n.unread" (click)="openNotification(n)">
              <img class="avatar" [src]="n.authorPhoto || defaultAvatar" alt="{{n.authorUsername}} avatar" />
              <div class="notif-body">
                <!-- <div class="notif-title">{{ n.postTitle }}</div> -->
                <div class="notif-title">{{ n.authorUsername }} created new post.</div>
                <div class="notif-meta">
                  <!-- <span class="author">{{ n.authorUsername }}</span> -->
                  •
                  <span class="time">{{ n.postCreatedAt | date:'short' }}</span>
                </div>
              </div>
              <span class="dot" *ngIf="n.unread" title="Unread"></span>
            </div>
          </div>

          <ng-template #noNotif>
            <div class="notif-empty">No notifications</div>
          </ng-template>
        </div>
      </div>
    </ng-container>
  </nav>
</header>
