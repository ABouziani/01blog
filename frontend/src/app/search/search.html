<mat-form-field appearance="outline" class="search-form custom-search">
  <mat-label style="margin-left: 10px;">Search</mat-label>

  <input matInput class="search-input" [(ngModel)]="query" (keyup.enter)="onSearch()"
    placeholder="e.g. john, tutorial..." autocomplete="off" />

  <mat-select matIconPrefix class="search-type" [(ngModel)]="type">
    <mat-option value="users">Users</mat-option>
    <mat-option value="posts">Posts</mat-option>
  </mat-select>

  <button matSuffix mat-icon-button class="search-button" (click)="onSearch()" [disabled]="!query.trim()">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>
