<div class="container my-4">
    <div class="input-group input-group-lg custom-search-bar shadow-sm rounded-3">
        
        <select class="form-select search-type-select fw-semibold" 
                [(ngModel)]="type" 
                aria-label="Select search type">
            <option value="users">Users</option>
            <option value="posts">Posts</option>
        </select>
        
        <input type="text" 
               class="form-control search-input" 
               [(ngModel)]="query" 
               (keyup.enter)="onSearch()"
               placeholder="Search posts or users (e.g., john, tutorial...)" 
               autocomplete="off" 
               aria-label="Search input field">
        
        <button class="btn btn-primary search-button" 
                (click)="onSearch()" 
                [disabled]="!query.trim()">
            <i class="bi bi-search"></i>
        </button>
    </div>
</div>
