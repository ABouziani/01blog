<mat-form-field appearance="outline" class="search-form">
      <mat-label>Search</mat-label>
      <input
        matInput
        [(ngModel)]="query"
        (keyup.enter)="onSearch()"
        placeholder="e.g. john, tutorial..."
        autocomplete="off"
      />
      <mat-select matIconPrefix [(ngModel)]="type">
        <mat-option value="users">Users</mat-option>
        <mat-option value="posts">Posts</mat-option>
      </mat-select>
      <button matSuffix mat-icon-button (click)="onSearch()" [disabled]="!query.trim()">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
