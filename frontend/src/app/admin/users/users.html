<h2>Users</h2>
<table mat-table [dataSource]="users" class="mat-elevation-z8">
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Username</th>
    <td mat-cell *matCellDef="let user" [routerLink]="[`/users/${user.id}`]"><span class="table-username">{{
        user.username }}</span></td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
  </ng-container>

  <ng-container matColumnDef="since">
    <th mat-header-cell *matHeaderCellDef>Membre since</th>
    <td mat-cell *matCellDef="let user">{{ user.createdAt | date:'short' }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let user">
      <span [class.banned]="user.isBanned">{{ user.isBanned ? 'Banned' : 'Active' }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let user">
      @if (user.isBanned) {
      <button mat-button disabled>Ban</button>
      } @else {
      <button mat-button color="warn" (click)="openConfirmDialog('ban', user.id, user.username)">
        Ban
      </button>
      }
      <button mat-button color="primary" (click)="openConfirmDialog('delete', user.id, user.username)">
        Delete
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
