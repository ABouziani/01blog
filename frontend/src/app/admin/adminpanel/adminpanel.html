<div class="admin-container">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="toggler-wrap">
      <button class="mobile-toggle" (click)="toggleBar()">
        <i class="bi bi-x toggler toggler-mobile"></i>
      </button>
    </div>
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <i class="bi bi-shield-check"></i> Admin Panel
      </div>
    </div>
    <nav class="nav-list">
      <div class="nav-item">
        <a class="nav-link active" (click)="toggleBar(); selectTab('summary')" routerLink="summary" routerLinkActive="active"
          [class.active]="activeTab() === 'summary'">
          <i class="bi bi-people"></i>
          <span>Summary</span>
        </a>
      </div>
      <div class="nav-item">
        <a class="nav-link active" (click)="toggleBar(); selectTab('users')" routerLink="users" routerLinkActive="active"
          [class.active]="activeTab() === 'users'">
          <i class="bi bi-people"></i>
          <span>Users</span>
        </a>
      </div>
      <div class="nav-item">
        <a class="nav-link" (click)="toggleBar(); selectTab('posts')" routerLink="posts" routerLinkActive="active"
          [class.active]="activeTab() === 'posts'">
          <i class="bi bi-file-text"></i>
          <span>Posts</span>
        </a>
      </div>
      <div class="nav-item">
        <a class="nav-link" (click)="toggleBar(); selectTab('reports')" routerLink="reports" routerLinkActive="active"
          [class.active]="activeTab() === 'reports'">
          <i class="bi bi-flag"></i>
          <span>Reports</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Top Bar -->
    <div class="admin-topbar">
      <div class="topbar-content">
        <div>
          <button class="mobile-toggle" (click)="toggleBar()">
            <i class="bi bi-list"></i>
          </button>
          <span class="topbar-welcome">Welcome, <span class="topbar-username">{{ adminUsername }}</span></span>
        </div>
        <!-- <div class="topbar-title">Admin Dashboard</div> -->
      </div>
    </div>

    <!-- Content Area -->
    <div class="admin-content">
      @switch (activeTab()) {
      @case ('summary') {
      <app-admin-summary></app-admin-summary>
      }
      @case ('users') {
      <app-admin-users></app-admin-users>
      }
      @case ('posts') {
      <app-admin-posts></app-admin-posts>
      }
      @case ('reports') {
      <app-admin-reports></app-admin-reports>
      }
      }
    </div>
  </main>
</div>
